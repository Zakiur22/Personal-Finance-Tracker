name: bethriftytoday
description:
  A simple money management app for those who want to be in control of their
  financial life.

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  after_layout: ^1.2.0
  cloud_firestore: ^4.17.3
  collection: ^1.18.0
  encrypt: ^5.0.3
  firebase_analytics: ^10.10.5
  firebase_auth: ^4.19.5
  firebase_core: ^2.31.0
  firebase_messaging: ^14.9.2
  google_sign_in: ^6.2.1
  http: ^1.2.1
  intl: ^0.20.2
  json_annotation: ^4.9.0
  local_auth: ^2.2.0
  package_info_plus: ^8.0.0
  path: ^1.9.0
  provider: ^6.1.2
  share_plus: ^9.0.0
  shared_preferences: ^2.2.3
  sqflite: ^2.3.3+1
  transparent_image: ^2.0.1
  url_launcher: ^6.3.0
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.13.1
  json_serializable: ^6.8.0
  flutter_lints: ^3.0.0
  intl_utils: ^2.8.7


flutter:
  uses-material-design: true
  assets:
    - assets/logos/
    - assets/images/
    - assets/categories/expense/
    - assets/categories/income/
    - assets/categories/custom/
  fonts:
    - family: FiraSans
      fonts:
        - asset: assets/fonts/FiraSans-Regular-400.ttf
          weight: 400
        - asset: assets/fonts/FiraSans-Medium-500.ttf
          weight: 500
        - asset: assets/fonts/FiraSans-SemiBold-600.ttf
          weight: 600
        - asset: assets/fonts/FiraSans-Bold-700.ttf
          weight: 700
        - asset: assets/fonts/FiraSans-ExtraBold-800.ttf
          weight: 800

flutter_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon.png

flutter_intl:
  enabled: true
